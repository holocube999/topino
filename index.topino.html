<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ToPino — quest for brownies</title>
<style>
:root{--ui:#f7eed7;--shadow:#08151a;--accent:#e56d8a}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07171c;touch-action:none}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;user-select:none;-webkit-user-select:none}
#skyfx{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0;pointer-events:none;image-rendering:pixelated}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1;image-rendering:pixelated;image-rendering:crisp-edges;background:linear-gradient(180deg,#4ca8c8 0%,#73c1d0 48%,#a6d5bc 78%,#6ba67b 100%)}
#fogfx{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:3;image-rendering:pixelated}
#fx2{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:4;image-rendering:pixelated}
#hud{position:absolute;inset:0;color:#fff8e7;pointer-events:none;text-shadow:0 2px 2px rgba(0,0,0,.8),0 0 8px rgba(0,0,0,.25);z-index:6}
#topbar{
  position:absolute;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;
  display:flex;justify-content:space-between;align-items:flex-start;gap:10px
}
#mission,#stats{
  position:relative;overflow:hidden;
  font-size:12px;line-height:1.22;
  background:linear-gradient(180deg,rgba(8,18,25,.72),rgba(5,10,15,.54));
  border:1px solid rgba(255,231,170,.28);
  padding:9px 12px;border-radius:9px;
  backdrop-filter:blur(7px);
  box-shadow:0 5px 18px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.08);
  font-weight:820;letter-spacing:.035em
}
#mission:before,#stats:before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,#ffd65c,#e86f88)
}
#mission{max-width:67%;text-transform:uppercase}
#mission:after{
  content:"QUEST";display:block;margin-top:3px;
  font-size:8px;letter-spacing:.20em;color:#ffd76d;opacity:.85
}
#stats{text-align:right;min-width:108px}
#stats span{display:inline-block;margin:1px 0}
#message{
  position:absolute;left:50%;top:18%;transform:translate(-50%,-50%);
  width:min(90vw,560px);text-align:center;font-size:clamp(18px,5vw,31px);
  font-weight:950;letter-spacing:.02em;opacity:0;transition:opacity .16s;
  color:#fff7df;text-shadow:0 3px 0 rgba(68,35,22,.85),0 0 14px rgba(255,208,100,.35)
}
#pickupFx{
  position:absolute;left:50%;top:30%;transform:translate(-50%,0) scale(.84);z-index:12;
  min-width:220px;max-width:90vw;padding:14px 22px;border-radius:18px;
  background:linear-gradient(180deg,rgba(84,30,10,.22),rgba(0,0,0,.12));
  border:2px solid rgba(255,244,200,.42);color:#fff7c8;
  font-size:clamp(22px,6.4vw,42px);font-weight:1000;letter-spacing:.03em;-webkit-text-stroke:1px rgba(84,40,12,.55);
  text-align:center;opacity:0;pointer-events:none;
  box-shadow:0 8px 18px rgba(0,0,0,.35),0 0 18px rgba(255,210,84,.18);
  text-shadow:0 3px 0 rgba(0,0,0,.55),0 0 12px rgba(255,224,122,.35);
}
#pickupFx.pop{
  animation:pickupPop 1.18s cubic-bezier(.18,.74,.18,1) both;
}
@keyframes pickupPop{
  0%{opacity:0;transform:translate(-50%,18px) scale(.64)}
  10%{opacity:1;transform:translate(-50%,-6px) scale(1.22)}
  30%{opacity:1;transform:translate(-50%,-18px) scale(1.04)}
  75%{opacity:1;transform:translate(-50%,-34px) scale(1.0)}
  100%{opacity:0;transform:translate(-50%,-74px) scale(.96)}
}
#controls{position:absolute;left:0;right:0;bottom:0;height:196px;pointer-events:none;z-index:8}
#joy{
  position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(24px,env(safe-area-inset-bottom));
  width:144px;height:144px;border-radius:50%;
  background:radial-gradient(circle,rgba(45,60,61,.52),rgba(12,20,24,.50));
  border:1px solid rgba(255,240,198,.24);pointer-events:auto;touch-action:none;
  backdrop-filter:blur(5px);box-shadow:0 10px 26px rgba(0,0,0,.28),inset 0 0 0 5px rgba(255,255,255,.025)
}
#stick{
  position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;
  background:rgba(245,230,201,.72);border:2px solid rgba(255,255,255,.38);box-shadow:0 4px 10px rgba(0,0,0,.34)
}
.btn{
  position:absolute;pointer-events:auto;touch-action:none;border:0;border-radius:50%;
  color:#2b241d;background:linear-gradient(180deg,rgba(255,237,194,.96),rgba(224,190,133,.94));
  font-weight:1000;letter-spacing:.045em;
  border:1px solid rgba(255,255,255,.32);
  box-shadow:0 6px 0 rgba(91,61,36,.82),0 11px 20px rgba(0,0,0,.24);
  display:flex;align-items:center;justify-content:center
}
#jump{right:max(26px,env(safe-area-inset-right));bottom:max(32px,env(safe-area-inset-bottom));width:78px;height:78px;font-size:17px}
#act{right:max(112px,calc(env(safe-area-inset-right) + 112px));bottom:max(92px,calc(env(safe-area-inset-bottom) + 92px));width:62px;height:62px;font-size:13px}
#camHint{display:none}
#start{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;
  background:linear-gradient(180deg,#3d91ba 0%,#72b9c7 48%,#87ad72 78%,#314d3c 100%);
  color:#fff7df;padding:24px;text-align:center;overflow:hidden
}
#start:before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 72% 19%,rgba(255,237,153,.34) 0 4%,rgba(255,213,109,.12) 12%,transparent 26%);
  pointer-events:none
}
#start .card{
  position:relative;z-index:2;width:min(88vw,430px);padding:28px 24px 24px;
  border:1px solid rgba(255,244,205,.22);border-radius:18px;
  background:linear-gradient(180deg,rgba(8,25,32,.50),rgba(6,17,23,.38));
  box-shadow:0 24px 60px rgba(0,0,0,.30),inset 0 1px rgba(255,255,255,.08);
  backdrop-filter:blur(5px)
}
#start h1{
  margin:0;font-size:clamp(50px,16vw,82px);line-height:.84;font-weight:1000;letter-spacing:-.07em;
  color:#fff0ae;text-shadow:0 5px 0 #603a31,0 0 18px rgba(255,213,96,.38)
}
#start p{
  margin:11px 0 0;font-size:clamp(14px,4.2vw,21px);font-weight:950;letter-spacing:.13em;
  text-transform:uppercase;color:#fff8e1;text-shadow:0 2px 0 rgba(0,0,0,.55)
}
#start .credits{
  margin-top:18px;font-size:10px;line-height:1.65;letter-spacing:.18em;text-transform:uppercase;
  color:#f0db9f;font-weight:800
}
#start button{
  margin-top:22px;min-width:190px;min-height:56px;border:1px solid rgba(255,255,255,.34);border-radius:12px;
  background:linear-gradient(180deg,#ffe49a,#ddb260);color:#352419;font-weight:1000;font-size:17px;letter-spacing:.14em;
  box-shadow:0 6px 0 #825534,0 11px 24px rgba(0,0,0,.28);animation:playPulse 1.8s ease-in-out infinite
}
#start button:active{transform:translateY(4px);box-shadow:0 2px 0 #825534}
@keyframes playPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.10)}}
#ending{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:18;
  pointer-events:none;text-align:center;opacity:.92
}
#ending .txt{
  font-weight:950;color:#fff4dd;text-shadow:0 4px 0 #3a2319,0 0 18px #ffba4e;
  font-size:clamp(36px,11vw,84px);line-height:.95
}
#ending .date{font-size:.42em;margin-top:12px;color:#ffd35c;letter-spacing:.08em}
.scan{position:absolute;inset:0;pointer-events:none;z-index:7;opacity:.045;background:repeating-linear-gradient(180deg,rgba(255,255,255,.11) 0 1px,transparent 1px 4px);mix-blend-mode:overlay}
.vignette{position:absolute;inset:0;pointer-events:none;z-index:7;background:radial-gradient(ellipse at center,transparent 53%,rgba(0,0,0,.28) 100%)}
@media (max-height:560px){
 #controls{height:152px}
 #joy{width:108px;height:108px}
 #stick{width:48px;height:48px;margin:-24px}
 #jump{width:66px;height:66px}
 #act{width:54px;height:54px;right:100px;bottom:72px}
}

#boot{
  position:absolute;inset:0;z-index:30;background:#020204;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;pointer-events:auto;color:#eee;
}
#boot.bootOut{animation:bootOut .75s ease forwards}
#bootStage{position:absolute;inset:0}
#bootFlash{
  position:absolute;inset:0;background:#e9e9e4;opacity:0;
  animation:bootFlash 4.35s linear forwards;
}
#bootLogo{
  position:absolute;left:50%;top:45%;width:150px;height:150px;
  transform:translate(-50%,-50%) scale(.25) rotateX(58deg) rotateZ(-38deg);
  opacity:0;filter:drop-shadow(0 14px 18px rgba(0,0,0,.45));
  animation:bootLogo 4.35s cubic-bezier(.22,.66,.25,1) forwards;
  transform-style:preserve-3d;
}
#bootLogo .cubeTop,#bootLogo .cubeLeft,#bootLogo .cubeRight{
  position:absolute;left:50%;top:50%;
  transform-origin:center center;
  image-rendering:pixelated;
}
#bootLogo .cubeTop{
  width:78px;height:44px;margin-left:-39px;margin-top:-58px;
  background:linear-gradient(135deg,#ffd94a 0 48%,#ff7d39 49% 100%);
  clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);
}
#bootLogo .cubeLeft{
  width:78px;height:78px;margin-left:-78px;margin-top:-20px;
  background:linear-gradient(160deg,#e84254 0 48%,#ac2f79 49% 100%);
  clip-path:polygon(0 0,100% 25%,100% 100%,0 75%);
}
#bootLogo .cubeRight{
  width:78px;height:78px;margin-left:0;margin-top:-20px;
  background:linear-gradient(160deg,#2ca6d7 0 48%,#3155b9 49% 100%);
  clip-path:polygon(0 25%,100% 0,100% 75%,0 100%);
}
#bootLogo .cubeCore{
  position:absolute;left:50%;top:50%;width:28px;height:28px;
  margin-left:-14px;margin-top:-4px;border-radius:4px;
  background:linear-gradient(135deg,#74d86f,#36a45f);
  box-shadow:0 0 14px rgba(115,226,136,.32);
  transform:rotate(45deg);
}
#bootName{
  position:absolute;left:50%;top:66%;transform:translateX(-50%);
  font:700 clamp(15px,4vw,22px)/1 system-ui,sans-serif;
  letter-spacing:.24em;text-transform:uppercase;color:#d8d8d4;
  opacity:0;animation:bootName 4.35s linear forwards;white-space:nowrap;
}
#bootFine{
  position:absolute;left:50%;top:72%;transform:translateX(-50%);
  font:600 clamp(9px,2.4vw,12px)/1 system-ui,sans-serif;
  letter-spacing:.18em;color:#818181;opacity:0;
  animation:bootFine 4.35s linear forwards;white-space:nowrap;
}
@keyframes bootFlash{
  0%,5%{opacity:0} 8%{opacity:.92} 15%{opacity:.12}
  24%,100%{opacity:0}
}
@keyframes bootLogo{
  0%,16%{opacity:0;transform:translate(-50%,-50%) scale(.18) rotateX(64deg) rotateZ(-50deg)}
  25%{opacity:1}
  55%{opacity:1;transform:translate(-50%,-50%) scale(1.0) rotateX(16deg) rotateZ(-5deg)}
  76%,100%{opacity:1;transform:translate(-50%,-50%) scale(.92) rotateX(0deg) rotateZ(0deg)}
}
@keyframes bootName{
  0%,56%{opacity:0} 68%,92%{opacity:.95} 100%{opacity:0}
}
@keyframes bootFine{
  0%,64%{opacity:0} 74%,92%{opacity:.75} 100%{opacity:0}
}
@keyframes bootOut{to{opacity:0;visibility:hidden}}

</style>
</head>
<body>

<div id="boot">
  <div id="bootStage">
    <div id="bootFlash"></div>
    <div id="bootLogo">
      <div class="cubeTop"></div>
      <div class="cubeLeft"></div>
      <div class="cubeRight"></div>
      <div class="cubeCore"></div>
    </div>
    <div id="bootName">HOLOSTATION ENTERIMENT SYSTEM</div>
    <div id="bootFine">virtual entertainment startup</div>
  </div>
</div>
<canvas id="skyfx"></canvas>
<canvas id="game"></canvas>
<canvas id="fogfx"></canvas>
<canvas id="fx2"></canvas>
<div id="hud">
  <div id="topbar">
    <div id="mission">ESPLORA L’ISOLA</div>
    <div id="stats" style="display:none"><span id="brownieStat"></span><br><span id="keyStat"></span></div>
  </div>
  <div id="message"></div>
  <div id="pickupFx"></div>
</div>

<div id="controls">
  <div id="joy"><div id="stick"></div></div>
  <button class="btn" id="jump" type="button">SALTA</button>
  <button class="btn" id="act" type="button">AZIONE</button>
  <div id="camHint"></div>
</div>

<div id="start" style="display:none">
  <div class="card">
    <h1>ToPino</h1>
    <p>quest for brownies</p>
    <div class="credits">ATHEANGODS SOFTWARE<br>PROGRAMMED BY HOLOCUBE</div>
    <button id="startBtn" type="button">GIOCA</button>
  </div>
</div>

<div id="ending"><div class="txt">AUGURI<br>PACCOTTY<div class="date">7/9/2026</div></div></div>
<div class="scan"></div><div class="vignette"></div>

const V=(x=0,y=0,z=0)=>({x,y,z});
const add=(a,b)=>V(a.x+b.x,a.y+b.y,a.z+b.z);
const sub=(a,b)=>V(a.x-b.x,a.y-b.y,a.z-b.z);
const mul=(a,s)=>V(a.x*s,a.y*s,a.z*s);
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const len=a=>Math.hypot(a.x,a.y,a.z);
const norm=a=>{const l=len(a)||1;return V(a.x/l,a.y/l,a.z/l)};
const dot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z;
const cross=(a,b)=>V(a.y*b.z-a.z*b.y,a.z*b.x-a.x*b.z,a.x*b.y-a.y*b.x);
const mix=(a,b,t)=>V(lerp(a.x,b.x,t),lerp(a.y,b.y,t),lerp(a.z,b.z,t));
function lerpAngle(a,b,t){
  let d=((b-a+Math.PI)%(Math.PI*2))-Math.PI;
  return a+d*t;
}

function makeSphere(lat=4,lon=7){
  const v=[],f=[];
  for(let y=0;y<=lat;y++){
    const py=y/lat, th=py*Math.PI;
    for(let x=0;x<=lon;x++){
      const px=x/lon, ph=px*Math.PI*2;
      v.push(V(Math.sin(th)*Math.cos(ph),Math.cos(th),Math.sin(th)*Math.sin(ph)));
    }
  }
  const row=lon+1;
  for(let y=0;y<lat;y++){
    for(let x=0;x<lon;x++){
      const a=y*row+x,b=a+1,c=a+row,d=c+1;
      if(y!==0)f.push([a,c,b]);
      if(y!==lat-1)f.push([b,c,d]);
    }
  }
  return {v,f};
}
function makeBox(){
  const v=[V(-1,-1,-1),V(1,-1,-1),V(1,1,-1),V(-1,1,-1),V(-1,-1,1),V(1,-1,1),V(1,1,1),V(-1,1,1)];
  const f=[[0,2,1],[0,3,2],[4,5,6],[4,6,7],[0,4,7],[0,7,3],[1,2,6],[1,6,5],[3,7,6],[3,6,2],[0,1,5],[0,5,4]];
  return {v,f};
}
function makeCone(n=8){
  const v=[V(0,1,0),V(0,-1,0)];
  for(let i=0;i<n;i++){const a=i*Math.PI*2/n;v.push(V(Math.cos(a),-1,Math.sin(a)));}
  const f=[];
  for(let i=0;i<n;i++){const a=2+i,b=2+((i+1)%n);f.push([0,a,b]);f.push([1,b,a]);}
  return {v,f};
}
function makeCylinder(n=8){
  const v=[];
  for(let j=0;j<2;j++)for(let i=0;i<n;i++){const a=i*Math.PI*2/n;v.push(V(Math.cos(a),j?1:-1,Math.sin(a)));}
  const f=[];
  for(let i=0;i<n;i++){
    const ni=(i+1)%n;
    f.push([i,ni,n+ni],[i,n+ni,n+i]);
  }
  return {v,f};
}
const MESH={

  sphereLow:makeSphere(2,5),
  box:makeBox(),
  cone:makeCone(8),
  cyl:makeCylinder(8)
};

function transformPoint(p,pos,ry=0,rx=0,rz=0,scale=V(1,1,1)){
  let x=p.x*scale.x, y=p.y*scale.y, z=p.z*scale.z;
  let c=Math.cos(rx), s=Math.sin(rx), ny=y*c-z*s, nz=y*s+z*c; y=ny; z=nz;
  c=Math.cos(ry); s=Math.sin(ry); let nx=x*c+z*s; nz=-x*s+z*c; x=nx; z=nz;
  c=Math.cos(rz); s=Math.sin(rz); nx=x*c-y*s; ny=x*s+y*c; x=nx; y=ny;
  return V(x+pos.x,y+pos.y,z+pos.z);
}
function emitMesh(out,mesh,pos,ry=0,rx=0,rz=0,scale=V(1,1,1),color=[255,255,255]){
  const wv=mesh.v.map(p=>transformPoint(p,pos,ry,rx,rz,scale));
  for(const fi of mesh.f){
    const a=wv[fi[0]],b=wv[fi[1]],c=wv[fi[2]];
    out.push({a,b,c,color});
  }
}
function local(base,yaw,lx,ly,lz){
  const c=Math.cos(yaw), s=Math.sin(yaw);
  return V(base.x + lx*c + lz*s, base.y + ly, base.z - lx*s + lz*c);
}
function emitSphere(out,pos,scale,color,ry=0,kind='med'){emitMesh(out, kind==='char'?MESH.sphereChar:kind==='hi'?MESH.sphereHi:kind==='low'?MESH.sphereLow:MESH.sphereMed, pos, ry,0,0,scale,color);}
function emitBox(out,pos,scale,color,ry=0,rx=0,rz=0){emitMesh(out,MESH.box,pos,ry,rx,rz,scale,color);}
function emitCone(out,pos,scale,color,ry=0,rx=0,rz=0){emitMesh(out,MESH.cone,pos,ry,rx,rz,scale,color);}
function emitCyl(out,pos,scale,color,ry=0,rx=0,rz=0){emitMesh(out,MESH.cyl,pos,ry,rx,rz,scale,color);}
function emitChain(out,a,b,r,color,kind='low'){
  const steps=3;
  for(let i=0;i<=steps;i++){
    const p=mix(a,b,i/steps);
    emitSphere(out,p,V(r,r,r),color,0,kind);
  }
}
function emitShadow(out,pos,r1=.7,r2=.48,alpha=.55){
  const c=shade(PAL.shadow,.72+alpha*.18);
  const center=V(pos.x,pos.y+0.018,pos.z);
  const n=10;
  for(let i=0;i<n;i++){
    const a=i*Math.PI*2/n,b=(i+1)*Math.PI*2/n;
    out.push({
      a:center,
      b:V(pos.x+Math.cos(a)*r1,pos.y+0.018,pos.z+Math.sin(a)*r2),
      c:V(pos.x+Math.cos(b)*r1,pos.y+0.018,pos.z+Math.sin(b)*r2),
      color:c,
      shadow:true
    });
  }
}

function emitSegment(out,a,b,r,color){
  const d=sub(b,a);
  const L=Math.max(.001,len(d));
  const mid=mix(a,b,.5);
  const horiz=Math.hypot(d.x,d.z);
  const ry=Math.atan2(d.x,d.z);
  const rx=-Math.atan2(horiz,d.y);
  emitCyl(out,mid,V(r,L*.5,r),color,ry,rx,0);
}
function emitTree(out,x,z,s=1,yaw=0){
  const y=terrainHeight(x,z);
  const root=V(x,y+.02,z);
  const trunkTop=V(x,y+2.15*s,z);
  emitSegment(out,root,trunkTop,.18*s,PAL.barkLight);

  const branches=[
    [V(0,1.15,0),V(.72,2.00,.30)],
    [V(0,1.35,0),V(-.62,2.15,-.22)],
    [V(0,1.55,0),V(.38,2.45,-.55)],
    [V(0,1.62,0),V(-.28,2.52,.48)],
    [V(0,1.78,0),V(.12,2.72,.12)]
  ];
  const c=Math.cos(yaw), ss=Math.sin(yaw);
  const rot=(p)=>V(x+p.x*c+p.z*ss,y+p.y,z-p.x*ss+p.z*c);
  for(const br of branches){
    const a=rot(br[0]),b=rot(br[1]);
    emitSegment(out,a,b,.075*s,shade(PAL.barkLight,.92));
    const tip=b;
    emitSphere(out,tip,V(.58*s,.48*s,.52*s),PAL.leafA,yaw,'med');
    emitSphere(out,add(tip,V(.24*s,.20*s,.02)),V(.46*s,.38*s,.42*s),PAL.leafB,yaw+.6,'low');
    emitSphere(out,add(tip,V(-.20*s,.10*s,.18*s)),V(.42*s,.34*s,.38*s),PAL.leafC,yaw-.4,'low');
  }
}

function pathCenterX(z){ return Math.sin(z*0.18)*3.0 + Math.sin(z*0.045)*1.2; }
function pathDist(x,z){ return Math.abs(x-pathCenterX(z)); }

function islandRadiusAtAngle(a){
  return 18.7
    + Math.sin(a*3.0)*1.8
    + Math.cos(a*5.0)*1.25
    + Math.sin(a*7.0)*0.85
    + Math.cos(a*11.0)*0.38;
}
function islandField(x,z){
  const ax=x*0.96, az=z*1.04;
  const a=Math.atan2(az,ax);
  const r=Math.hypot(ax,az);
  return r-islandRadiusAtAngle(a);
}
function pondField(x,z){
  const dx=(x-6.2)/3.5, dz=(z+5.5)/2.45;
  return dx*dx+dz*dz-1.0;
}
function inWater(x,z){
  return islandField(x,z)>0 || pondField(x,z)<0;
}
function waterHeight(x,z,t=0){
  return SEA_LEVEL
    + Math.sin(t*1.45 + x*0.22 + z*0.17)*0.055
    + Math.cos(t*1.05 + x*0.11 - z*0.19)*0.035;
}
function terrainHeight(x,z){
  const edge=islandField(x,z);
  const pond=pondField(x,z);

  if(edge>0) return SEA_LEVEL;

  let h=0.16*Math.sin(x*0.20)+0.11*Math.cos(z*0.26)+0.05*Math.sin((x+z)*0.37);
  h += 0.34*Math.exp(-((x+4.8)*(x+4.8)+(z-4.2)*(z-4.2))/18);
  h += 0.23*Math.exp(-((x-7.5)*(x-7.5)+(z+1.0)*(z+1.0))/16);
  h -= clamp(1-pathDist(x,z)/2.2,0,1)*0.06;

  // Blend down gently toward the coast so the island ends naturally.
  const coast=clamp((-edge)/2.65,0,1);
  h = lerp(SEA_LEVEL+0.05,h,coast);

  // Small inner pond remains, but lower and quieter than the sea.
  if(pond<0){
    const pd=clamp(1-( ((x-6.2)/3.5)**2 + ((z+5.5)/2.45)**2 ),0,1);
    h = lerp(h,SEA_LEVEL+0.03,pd);
  }

  return h;
}

const staticWorld=[];

const pebbles=[];
const trees=[];
function addGroundPatch(x0,z0,s,cl){
  const a=V(x0,terrainHeight(x0,z0),z0),
        b=V(x0+s,terrainHeight(x0+s,z0),z0),
        c=V(x0+s,terrainHeight(x0+s,z0+s),z0+s),
        d=V(x0,terrainHeight(x0,z0+s),z0+s);
  staticWorld.push({a,b,c,color:cl});
  staticWorld.push({a:a,b:c,c:d,color:shade(cl,.96)});
}
function buildEnvironment(){
  staticWorld.length=0;
  rocks.length=0; grassClumps.length=0; pebbles.length=0; trees.length=0;

  // Main island mesh
  const step=1.20;
  for(let z=-28;z<28;z+=step){
    for(let x=-28;x<28;x+=step){
      const cx=x+step*0.5, cz=z+step*0.5;
      const edge=islandField(cx,cz);
      if(edge>0.6) continue;

      const coast=clamp(1-(-edge)/2.8,0,1);
      const variation=.95+.08*(.5+.5*Math.sin(cx*.71+cz*.43+Math.sin(cz*.21)*1.6));
      let col=shade(PAL.grassA,variation);

      if(pondField(cx,cz)<0){
        col=shade(PAL.waterA,.92+.07*Math.sin(cx*.48-cz*.52));
      }else if(coast>.08){
        // rocky / sandy rim
        const beachMix=.92+.06*Math.sin(cx*.32+cz*.41);
        col=coast>.45 ? shade([146,138,112],beachMix) : shade([111,128,91],beachMix);
      }else if(pathDist(cx,cz)<2.2){
        const edgep=clamp(pathDist(cx,cz)/2.2,0,1);
        col=shade(edgep>.62?PAL.pathB:PAL.pathA,.96+.05*Math.sin(cx*.51+cz*.37));
      }

      addGroundPatch(x,z,step,col);
    }
  }

  // A couple of offshore islets / rocky outcrops
  const islets=[
    [-27,-18,2.9,1.2,2.6],[-31,9,3.2,1.4,2.8],[22,26,3.0,1.15,2.7],[30,-6,2.6,1.0,2.3]
  ];
  for(const h of islets){
    const hy=SEA_LEVEL-0.38;
    emitSphere(staticWorld,V(h[0],hy+h[3]*.55,h[1]),V(h[2],h[3],h[4]),shade(PAL.rockA,.82),0,'med');
    emitSphere(staticWorld,V(h[0]+.8,hy+h[3]*.86,h[1]-.4),V(h[2]*.46,h[3]*.40,h[4]*.44),shade(PAL.grassC,.74),.4,'low');
  }

  const rockSeeds=[
    [-9.8,-7.4,1.6,.9,.8],[-11.2,4.9,1.9,1.1,.9],[-2.6,8.4,1.3,.8,1.2],[6.6,6.3,1.8,1.2,1.0],
    [12.1,2.5,1.5,1.0,.9],[11.4,-8.2,2.0,1.2,1.1],[-6.0,-11.0,1.7,1.1,.9],[2.7,-10.0,1.2,.9,.8]
  ];
  for(const r of rockSeeds){
    rocks.push({x:r[0],z:r[1],s:r[2],sy:r[3],sz:r[4],yaw:Math.random()*Math.PI*2});
  }
  for(const r of rocks){
    const y=terrainHeight(r.x,r.z);
    emitSphere(staticWorld,V(r.x,y+r.sy*0.55,r.z),V(r.s*0.75,r.sy,r.s*r.sz),PAL.rockA,r.yaw,'med');
    emitSphere(staticWorld,V(r.x+r.s*0.12,y+r.sy*0.48,r.z-r.s*0.08),V(r.s*0.52,r.sy*0.62,r.s*0.48),PAL.rockB,r.yaw*1.6,'low');
  }

  for(let i=0;i<34;i++){
    const x=(Math.random()*2-1)*16.5, z=(Math.random()*2-1)*16.5;
    if(inWater(x,z) || pathDist(x,z)<1.0 || islandField(x,z)>-1.6) continue;
    grassClumps.push({x,z,s:.55+Math.random()*.45, yaw:Math.random()*Math.PI*2});
  }
  for(const g of grassClumps){
    const y=terrainHeight(g.x,g.z);
    emitCone(staticWorld,V(g.x,y+g.s*0.32,g.z),V(g.s*0.16,g.s*0.58,g.s*0.16),shade(PAL.grassC,1.15),g.yaw,Math.PI);
    emitCone(staticWorld,V(g.x+Math.cos(g.yaw)*0.06,y+g.s*0.28,g.z+Math.sin(g.yaw)*0.06),V(g.s*0.12,g.s*0.48,g.s*0.12),shade(PAL.grassA,1.1),g.yaw+0.6,Math.PI);
    emitCone(staticWorld,V(g.x-Math.cos(g.yaw)*0.05,y+g.s*0.28,g.z-Math.sin(g.yaw)*0.05),V(g.s*0.12,g.s*0.44,g.s*0.12),shade(PAL.grassB,1.1),g.yaw-0.5,Math.PI);
  }

  for(let i=0;i<26;i++){
    const x=(Math.random()*2-1)*16.5, z=(Math.random()*2-1)*16.5;
    if(inWater(x,z) || islandField(x,z)>-1.5) continue;
    pebbles.push({x,z,s:.18+Math.random()*.12});
  }
  for(const p of pebbles){
    const y=terrainHeight(p.x,p.z);
    emitSphere(staticWorld,V(p.x,y+p.s*0.5,p.z),V(p.s*1.2,p.s,p.s),PAL.rockB,0,'low');
  }

  const treeSeeds=[
    [-14,-7,1.12,.3],[-12,8,1.0,1.4],[-8,12,1.08,2.3],
    [-2,-13,1.05,.8],[7,11,1.16,2.0],[13,7,1.0,.4],
    [14,-4,1.12,1.1],[-15,2,1.0,2.7],[3,14,1.0,.9]
  ];
  for(const t of treeSeeds){
    if(inWater(t[0],t[1]) || pathDist(t[0],t[1])<2.5 || islandField(t[0],t[1])>-2.0) continue;
    const tree={x:t[0],z:t[1],s:t[2],yaw:t[3]};
    trees.push(tree);
    emitTree(staticWorld,tree.x,tree.z,tree.s,tree.yaw);
  }

  // little wooden bridge stones near the pond edge
  for(let i=0;i<4;i++){
    const x=3.8+i*1.1,z=-4.1+i*0.12;
    const y=Math.max(terrainHeight(x,z),SEA_LEVEL+0.10);
    emitBox(staticWorld,V(x,y+0.12,z),V(.42,.12,.85),shade(PAL.rockA,1.1),0,0.06*Math.sin(i),0.1*Math.cos(i));
  }
}

  player.p.z+Math.cos(cam.yaw)*5.4

function updateCamera(dt){
  const flatSpeed=Math.hypot(player.v.x,player.v.z);

  // Pad movement never rotates the camera directly.
  if(cam.dragging){
    cam.lastManual=performance.now();
  }

  // Slow auto-recentre only after a pause from manual camera input.
  const sinceManual=(performance.now()-cam.lastManual)/1000;
  if(!cam.dragging && flatSpeed>1.2 && sinceManual>2.4){
    const behind=player.yaw+Math.PI;
    let d=((behind-cam.yaw+Math.PI)%(Math.PI*2))-Math.PI;
    const maxTurn=.38*dt;
    d=clamp(d,-maxTurn,maxTurn);
    cam.yaw+=d;
  }

  const dist=5.35-Math.min(.38,flatSpeed*.022);
  const desired=V(
    player.p.x+Math.sin(cam.yaw)*dist,
    player.p.y+2.72+Math.min(.18,flatSpeed*.02),
    player.p.z+Math.cos(cam.yaw)*dist
  );
  const groundUnderCamera=terrainHeight(desired.x,desired.z)+1.05;
  desired.y=Math.max(desired.y,groundUnderCamera);

  const posK=1-Math.exp(-dt*4.8);
  cam.p.x=lerp(cam.p.x,desired.x,posK);
  cam.p.y=lerp(cam.p.y,desired.y,1-Math.exp(-dt*4.0));
  cam.p.z=lerp(cam.p.z,desired.z,posK);

  const lookAhead=clamp(flatSpeed*.07,0,.38);
  const fwd=V(Math.sin(player.yaw),0,Math.cos(player.yaw));
  const tgt=V(
    player.p.x+fwd.x*lookAhead,
    player.p.y+1.08+clamp(player.v.y*.02,-.06,.08),
    player.p.z+fwd.z*lookAhead
  );
  const targetK=1-Math.exp(-dt*5.8);
  cam.target.x=lerp(cam.target.x,tgt.x,targetK);
  cam.target.y=lerp(cam.target.y,tgt.y,targetK);
  cam.target.z=lerp(cam.target.z,tgt.z,targetK);
}
function cameraBasis(){
  const f=norm(sub(cam.target,cam.p));
  const r=norm(cross(f,V(0,1,0)));
  const u=cross(r,f);
  return {f,r,u};
}

function compileShader(type,src){
  const sh=gl.createShader(type);
  gl.shaderSource(sh,src);
  gl.compileShader(sh);
  if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
  return sh;
}

uniform mat4 uVP;
uniform vec3 uCam;
varying vec3 vCol;
varying float vFog;
void main(){
  vec4 wp=vec4(aPos,1.0);
  gl_Position=uVP*wp;
  float d=distance(aPos,uCam);
  vFog=clamp((d-14.0)/25.0,0.0,0.91);

}`);

const sunDir=norm(V(-.62,.82,-.34));
let currentVP=null;
function projectWorldToScreen(v,vp=currentVP){
  if(!vp) return null;
  const x=v.x,y=v.y,z=v.z;
  const cx=vp[0]*x+vp[4]*y+vp[8]*z+vp[12];
  const cy=vp[1]*x+vp[5]*y+vp[9]*z+vp[13];
  const cz=vp[2]*x+vp[6]*y+vp[10]*z+vp[14];
  const cw=vp[3]*x+vp[7]*y+vp[11]*z+vp[15];
  if(cw<=0.001) return null;
  const nx=cx/cw, ny=cy/cw, nz=cz/cw;
  if(nz<-1.2 || nz>1.2) return null;
  return {x:(nx*.5+.5)*SW,y:(-ny*.5+.5)*SH,z:nz,w:cw};
}

gl.enable(gl.DEPTH_TEST);
gl.depthFunc(gl.LEQUAL);
gl.disable(gl.CULL_FACE);
gl.disable(gl.BLEND);
gl.clearColor(0,0,0,0);

function mat4Perspective(fov,aspect,near,far){
  const f=1/Math.tan(fov/2),nf=1/(near-far);
  return new Float32Array([
    f/aspect,0,0,0,
    0,f,0,0,
    0,0,(far+near)*nf,-1,
    0,0,(2*far*near)*nf,0
  ]);
}
function mat4LookAt(eye,center,up){
  const z=norm(sub(eye,center));
  const x=norm(cross(up,z));
  const y=cross(z,x);
  return new Float32Array([
    x.x,y.x,z.x,0,
    x.y,y.y,z.y,0,
    x.z,y.z,z.z,0,
    -dot(x,eye),-dot(y,eye),-dot(z,eye),1
  ]);
}
function mat4Mul(a,b){
  const o=new Float32Array(16);
  for(let c=0;c<4;c++){
    for(let r=0;r<4;r++){
      o[c*4+r]=
        a[0*4+r]*b[c*4+0]+
        a[1*4+r]*b[c*4+1]+
        a[2*4+r]*b[c*4+2]+
        a[3*4+r]*b[c*4+3];
    }
  }
  return o;
}
function triangleVertexData(tris){
  const data=new Float32Array(tris.length*18);
  let o=0;
  for(const tr of tris){
    const n=norm(cross(sub(tr.b,tr.a),sub(tr.c,tr.a)));
    const sun=Math.max(0,dot(n,sunDir));
    const hemi=.5+.5*Math.max(-.35,n.y);
    const lf=tr.ground?(0.88+sun*.18):(tr.shadow?1.0:(.50+sun*.52+hemi*.10));
    let cc=shade(tr.color,lf);
    if(!tr.shadow){
      const warm=sun*.13;
      cc=[
        clamp(cc[0]+255*warm*.28,0,255),
        clamp(cc[1]+184*warm*.13,0,255),
        clamp(cc[2]-255*warm*.05,0,255)
      ];
    }
    // PS1-style stepped lighting instead of a modern smooth tonal ramp.
    cc=cc.map(v=>Math.round(v/8)*8);
    const cr=cc[0]/255,cg=cc[1]/255,cb=cc[2]/255;
    for(const p of [tr.a,tr.b,tr.c]){
      data[o++]=p.x; data[o++]=p.y; data[o++]=p.z;
      data[o++]=cr; data[o++]=cg; data[o++]=cb;
    }
  }
  return data;
}
function bindInterleaved(buffer,data,usage){
  gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
  gl.bufferData(gl.ARRAY_BUFFER,data,usage);
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos,3,gl.FLOAT,false,24,0);
  gl.enableVertexAttribArray(aCol);
  gl.vertexAttribPointer(aCol,3,gl.FLOAT,false,24,12);
}
function uploadStatic(){
  if(staticUploaded)return;
  const data=triangleVertexData(staticWorld);
  bindInterleaved(staticBuffer,data,gl.STATIC_DRAW);
  staticCount=data.length/6;
  staticUploaded=true;
}
function drawFXSprites(sprites){
  fxCtx.clearRect(0,0,SW,SH);
  for(const s of sprites){
    if(s.kind==='face' && faceImg.complete){
      fxCtx.save();
      fxCtx.globalAlpha=Math.max(0,s.life);
      fxCtx.translate(s.x,s.y);
      fxCtx.rotate(s.r);
      fxCtx.drawImage(faceImg,-s.sz/2,-s.sz/2,s.sz,s.sz);
      fxCtx.restore();
    }else if(s.kind==='dust'){
      fxCtx.globalAlpha=Math.max(0,s.life);
      fxCtx.fillStyle=s.color;
      fxCtx.fillRect(s.x-s.sz/2,s.y-s.sz/2,s.sz,s.sz);
    }else if(s.kind==='fart'){
      fxCtx.save();
      fxCtx.translate(s.x,s.y);
      fxCtx.rotate(s.r||0);
      fxCtx.globalAlpha=Math.max(0,s.life)*.78;
      const r=s.sz;
      const grad=fxCtx.createRadialGradient(0,0,r*.12,0,0,r);
      grad.addColorStop(0,'rgba(226,255,186,.52)');
      grad.addColorStop(.55,'rgba(170,214,126,.32)');
      grad.addColorStop(1,'rgba(122,148,88,0)');
      fxCtx.fillStyle=grad;
      fxCtx.beginPath();
      fxCtx.arc(0,0,r,0,Math.PI*2);
      fxCtx.fill();
      fxCtx.globalAlpha=Math.max(0,s.life)*.35;
      fxCtx.fillStyle='rgba(244,255,218,.55)';
      fxCtx.beginPath();
      fxCtx.arc(r*.22,-r*.10,r*.20,0,Math.PI*2);
      fxCtx.fill();
      fxCtx.restore();
    }
  }
  fxCtx.globalAlpha=1;
}
function renderScene(dynamicTris,sprites=[]){
  uploadStatic();

  const proj=mat4Perspective(1.16,SW/SH,.08,70);
  const view=mat4LookAt(cam.p,cam.target,V(0,1,0));
  const vp=mat4Mul(proj,view);
  currentVP=vp;

  gl.viewport(0,0,SW,SH);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.useProgram(prog);
  gl.uniformMatrix4fv(uVP,false,vp);
  gl.uniform3f(uCam,cam.p.x,cam.p.y,cam.p.z);
  gl.uniform3f(uFog,PAL.fog[0]/255,PAL.fog[1]/255,PAL.fog[2]/255);

  // Ground and static scenery.
  gl.disable(gl.BLEND);
  gl.depthMask(true);
  gl.disable(gl.POLYGON_OFFSET_FILL);
  gl.uniform1f(uAlpha,1.0);
  gl.bindBuffer(gl.ARRAY_BUFFER,staticBuffer);
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos,3,gl.FLOAT,false,24,0);
  gl.enableVertexAttribArray(aCol);
  gl.vertexAttribPointer(aCol,3,gl.FLOAT,false,24,12);
  gl.drawArrays(gl.TRIANGLES,0,staticCount);

  // Contact shadows: separate pass, no depth write, no z-fighting with terrain.
  const shadowTris=dynamicTris.filter(t=>t.shadow);
  if(shadowTris.length){
    const sh=triangleVertexData(shadowTris);
    bindInterleaved(dynamicBuffer,sh,gl.DYNAMIC_DRAW);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
    gl.depthMask(false);
    gl.enable(gl.POLYGON_OFFSET_FILL);
    gl.polygonOffset(-1.0,-2.0);
    gl.uniform1f(uAlpha,.42);
    gl.drawArrays(gl.TRIANGLES,0,sh.length/6);
  }

  // Actors and pickups: fully solid and depth-correct.
  const solidTris=dynamicTris.filter(t=>!t.shadow);
  if(solidTris.length){
    const dyn=triangleVertexData(solidTris);
    bindInterleaved(dynamicBuffer,dyn,gl.DYNAMIC_DRAW);
    gl.disable(gl.BLEND);
    gl.depthMask(true);
    gl.disable(gl.POLYGON_OFFSET_FILL);
    gl.uniform1f(uAlpha,1.0);
    gl.drawArrays(gl.TRIANGLES,0,dyn.length/6);
  }

  gl.depthMask(true);
  gl.disable(gl.BLEND);
  gl.disable(gl.POLYGON_OFFSET_FILL);
  drawFXSprites(sprites);
}

function emitBrownie(out,p,t){
  emitShadow(out,V(p.x,terrainHeight(p.x,p.z)+0.03,p.z),.34,.24,.48);
  const y=p.y+0.38+Math.sin(t*2.9)*0.10;
  emitBox(out,V(p.x,y,p.z),V(.32,.15,.32),PAL.brownie);
  emitBox(out,V(p.x,y+.12,p.z),V(.27,.05,.27),PAL.brownie2);
  emitSphere(out,V(p.x-.08,y+.19,p.z+.05),V(.035,.025,.035),shade(PAL.dark,1.2),0,'low');
  emitSphere(out,V(p.x+.09,y+.20,p.z-.04),V(.035,.025,.035),shade(PAL.dark,1.2),0,'low');
  emitSphere(out,V(p.x+.02,y+.21,p.z+.11),V(.035,.025,.035),shade(PAL.dark,1.2),0,'low');
}

function emitKey(out,p,t){
  emitShadow(out,V(p.x,terrainHeight(p.x,p.z)+0.03,p.z),.32,.22,.42);
  const y=p.y+Math.sin(t*3.5)*0.14;
  const ry=t*.9;
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4+ry;
    emitBox(out,V(p.x+Math.cos(a)*.26,y+Math.sin(a)*.26,p.z),V(.055,.055,.055),PAL.key,0,0,a);
  }
  emitBox(out,V(p.x+.34*Math.cos(ry),y-.34*Math.sin(ry),p.z),V(.34,.05,.05),PAL.key,ry);
  emitBox(out,V(p.x+.55*Math.cos(ry),y-.55*Math.sin(ry),p.z),V(.06,.16,.05),PAL.key,ry);
  emitBox(out,V(p.x+.66*Math.cos(ry),y-.55*Math.sin(ry),p.z),V(.06,.10,.05),PAL.key,ry);
}

function emitGift(out){
  emitShadow(out,V(gift.p.x,terrainHeight(gift.p.x,gift.p.z)+0.03,gift.p.z),.78,.56,.50);

  // Base shell.
  emitBox(out,V(gift.p.x,gift.p.y-.06,gift.p.z),V(.58,.44,.58),PAL.gift);
  emitBox(out,V(gift.p.x,gift.p.y-.06,gift.p.z),V(.10,.46,.60),PAL.ribbon);
  emitBox(out,V(gift.p.x,gift.p.y-.06,gift.p.z),V(.60,.46,.10),PAL.ribbon);

  // When opened, fake a hollow cavity with a dark inset and visible inner rim.
  const o=gift.open;
  if(o>0.02){
    emitBox(out,V(gift.p.x,gift.p.y+.31,gift.p.z+.01),V(.40,.14,.40),[44,28,36]);
    emitBox(out,V(gift.p.x,gift.p.y+.36,gift.p.z+.01),V(.47,.045,.47),[196,116,136]);
    emitBox(out,V(gift.p.x,gift.p.y+.28,gift.p.z+.01),V(.045,.10,.47),shade(PAL.gift,.90));
    emitBox(out,V(gift.p.x,gift.p.y+.28,gift.p.z+.01),V(.47,.10,.045),shade(PAL.gift,.90));
  }

  const lidY=gift.p.y+.56+o*.26;
  emitBox(out,V(gift.p.x,lidY,gift.p.z-.10*o),V(.63,.10,.63),shade(PAL.gift,1.08),-.85*o,0,0);
  emitBox(out,V(gift.p.x,lidY+.01,gift.p.z-.10*o),V(.11,.12,.66),PAL.ribbon,-.85*o,0,0);
  emitSphere(out,V(gift.p.x-.14,lidY+.10,gift.p.z-.10*o),V(.16,.07,.10),PAL.ribbon);
  emitSphere(out,V(gift.p.x+.14,lidY+.10,gift.p.z-.10*o),V(.16,.07,.10),PAL.ribbon);
}

function emitMousePlayer(out,t){
  const sp=Math.hypot(player.v.x,player.v.z);
  const phase=player.runT*1.65;
  const run=Math.min(1,sp/4.5);
  const bob=Math.sin(phase*2.0)*0.055*run;
  const hip=player.p;

  emitShadow(out,V(hip.x,terrainHeight(hip.x,hip.z)+0.006,hip.z),.58,.34,.50);

  // torso + chest
  emitSphere(out,local(hip,player.yaw,0,0.88+bob,0.0),V(.39,.59,.31),PAL.mouseBody,player.yaw,'char');
  emitSphere(out,local(hip,player.yaw,0,1.13+bob,0.055),V(.275,.32,.215),PAL.mouseBody2,player.yaw,'char');
  emitSphere(out,local(hip,player.yaw,0,0.81+bob,0.145),V(.205,.255,.135),PAL.mouseBelly,player.yaw,'char');

  // head
  const headP=local(hip,player.yaw,0,1.55+bob,0.16);
  emitSphere(out,headP,V(.33,.30,.30),shade(PAL.mouseBody,1.06),player.yaw,'char');

  const earL=local(hip,player.yaw,-0.20,1.82+bob,0.05);
  const earR=local(hip,player.yaw,0.20,1.82+bob,0.05);
  emitSphere(out,earL,V(.16,.21,.09),PAL.mouseBody2,player.yaw,'hi');
  emitSphere(out,earR,V(.16,.21,.09),PAL.mouseBody2,player.yaw,'hi');
  emitSphere(out,local(hip,player.yaw,-0.20,1.82+bob,0.06),V(.10,.14,.04),PAL.pink,player.yaw,'low');
  emitSphere(out,local(hip,player.yaw,0.20,1.82+bob,0.06),V(.10,.14,.04),PAL.pink,player.yaw,'low');

  const snoutBase=local(hip,player.yaw,0,1.50+bob,0.34);
  emitCone(out,local(hip,player.yaw,0,1.50+bob,0.52),V(.12,.33,.12),PAL.pink,player.yaw,Math.PI/2);
  emitSphere(out,local(hip,player.yaw,0,1.50+bob,0.80),V(.07,.055,.07),PAL.dark,player.yaw,'low');

  emitSphere(out,local(hip,player.yaw,-0.12,1.58+bob,0.41),V(.045,.045,.045),PAL.dark,0,'low');
  emitSphere(out,local(hip,player.yaw,0.12,1.58+bob,0.41),V(.045,.045,.045),PAL.dark,0,'low');

  // arms
  const armSwing=Math.sin(phase*2.0)*0.28*run;
  const shoulders=[local(hip,player.yaw,-0.31,1.22+bob,0.075), local(hip,player.yaw,0.31,1.22+bob,0.075)];
  const hands=[local(hip,player.yaw,-0.33,0.76+bob,0.16+armSwing), local(hip,player.yaw,0.33,0.76+bob,0.16-armSwing)];
  emitChain(out,shoulders[0],hands[0],.075,PAL.mouseBody,'low');
  emitChain(out,shoulders[1],hands[1],.075,PAL.mouseBody,'low');
  emitSphere(out,hands[0],V(.07,.07,.07),shade(PAL.mouseBelly,1.08),0,'low');
  emitSphere(out,hands[1],V(.07,.07,.07),shade(PAL.mouseBelly,1.08),0,'low');

  // legs
  const legSwing=Math.sin(phase*2.0)*0.24*run;
  const liftL=Math.max(0,Math.sin(phase*2.0))*0.10*run;
  const liftR=Math.max(0,-Math.sin(phase*2.0))*0.10*run;
  const hipL=local(hip,player.yaw,-0.14,0.48+bob,-0.02);
  const hipR=local(hip,player.yaw,0.14,0.48+bob,-0.02);
  const footL=local(hip,player.yaw,-0.16,0.055+liftL,0.08-legSwing);
  const footR=local(hip,player.yaw,0.16,0.055+liftR,0.08+legSwing);
  emitChain(out,hipL,footL,.09,PAL.mouseBody2,'low');
  emitChain(out,hipR,footR,.09,PAL.mouseBody2,'low');
  emitSphere(out,footL,V(.10,.05,.15),shade(PAL.mouseBelly,1.08),player.yaw,'med');
  emitSphere(out,footR,V(.10,.05,.15),shade(PAL.mouseBelly,1.08),player.yaw,'med');

  // tail
  const tail0=local(hip,player.yaw,0,0.73+bob,-0.35);
  const tail1=local(hip,player.yaw,0,0.74+bob,-0.52);
  const tail2=local(hip,player.yaw,0,0.62+bob,-0.80+Math.sin(phase*1.1)*0.05);
  const tail3=local(hip,player.yaw,0,0.56+bob,-1.06+Math.sin(phase*1.1)*0.08);
  emitChain(out,tail0,tail1,.06,PAL.pink,'low');
  emitChain(out,tail1,tail2,.045,PAL.pink,'low');
  emitChain(out,tail2,tail3,.03,PAL.pink,'low');
}


function emitMrMousy(out,t){
  const p=mrMousy.p;
  const idle=Math.sin(t*1.6+mrMousy.seed)*.018 + mrMousy.idleNod;
  const bob=Math.sin(mrMousy.walkPhase*2)*.025 + idle;
  const earTw=Math.sin(t*3.4+mrMousy.seed)*.015;
  emitShadow(out,V(p.x,terrainHeight(p.x,p.z)+.006,p.z),.52,.30,.45);

  emitSphere(out,local(p,mrMousy.yaw,0,.56+bob,0),V(.34,.44,.28),[84,82,88],mrMousy.yaw,'hi');
  emitSphere(out,local(p,mrMousy.yaw,0,1.10+bob,.10),V(.31,.29,.28),[105,103,110],mrMousy.yaw,'hi');
  emitSphere(out,local(p,mrMousy.yaw,-.19,1.37+bob,.03+earTw),V(.15,.19,.08),[66,64,69],mrMousy.yaw,'med');
  emitSphere(out,local(p,mrMousy.yaw,.19,1.37+bob,.03-earTw),V(.15,.19,.08),[66,64,69],mrMousy.yaw,'med');
  emitSphere(out,local(p,mrMousy.yaw,-.19,1.37+bob,.04+earTw),V(.09,.12,.035),PAL.pink,mrMousy.yaw,'low');
  emitSphere(out,local(p,mrMousy.yaw,.19,1.37+bob,.04-earTw),V(.09,.12,.035),PAL.pink,mrMousy.yaw,'low');
  emitCone(out,local(p,mrMousy.yaw,0,1.08+bob,.48+.02*Math.sin(t*3.8)),V(.105,.30,.105),PAL.pink,mrMousy.yaw,Math.PI/2);
  emitSphere(out,local(p,mrMousy.yaw,0,1.08+bob,.74+.02*Math.sin(t*3.8)),V(.055,.045,.055),PAL.dark,mrMousy.yaw,'low');

  emitSphere(out,local(p,mrMousy.yaw,-.10,.90+bob,.28),V(.13,.08,.06),[145,48,62],mrMousy.yaw,'low');
  emitSphere(out,local(p,mrMousy.yaw,.10,.90+bob,.28),V(.13,.08,.06),[145,48,62],mrMousy.yaw,'low');
  emitBox(out,local(p,mrMousy.yaw,0,1.51+bob,.02),V(.16,.05,.16),[37,34,40],mrMousy.yaw);
  emitCyl(out,local(p,mrMousy.yaw,0,1.62+bob,.02),V(.12,.11,.12),[37,34,40],mrMousy.yaw);

  const leg=Math.sin(mrMousy.walkPhase*2)*.10;
  emitChain(out,local(p,mrMousy.yaw,-.12,.34,0),local(p,mrMousy.yaw,-.14,.03,.06-leg),.055,[68,67,72],'low');
  emitChain(out,local(p,mrMousy.yaw,.12,.34,0),local(p,mrMousy.yaw,.14,.03,.06+leg),.055,[68,67,72],'low');
}

function emitShrew(out,t){

  const rt=shrew.runT;
  const p=shrew.p;
  const idleSniff=(shrew.mode==='idle'?1:.45);
  const bodyBob=Math.abs(Math.sin(rt*2))*0.035 + Math.sin(t*1.8+shrew.seed)*0.012*idleSniff;
  emitShadow(out,V(p.x,terrainHeight(p.x,p.z)+0.006,p.z),.48,.25,.48);

  const body=local(p,shrew.yaw,0,0.43+bodyBob,0);
  emitSphere(out,body,V(.54,.38,.29),PAL.shrewA,shrew.yaw,'hi');
  emitSphere(out,local(p,shrew.yaw,0,0.43+bodyBob,-0.26),V(.34,.26,.22),PAL.shrewB,shrew.yaw,'low'); // rump
  const head=local(p,shrew.yaw,0,0.54+bodyBob,0.42);
  emitSphere(out,head,V(.31,.24,.22),shade(PAL.shrewA,1.06),shrew.yaw,'hi');
  emitSphere(out,local(p,shrew.yaw,-0.16,0.76,0.34),V(.11,.13,.04),PAL.shrewB,shrew.yaw,'low');
  emitSphere(out,local(p,shrew.yaw,0.16,0.76,0.34),V(.11,.13,.04),PAL.shrewB,shrew.yaw,'low');
  emitSphere(out,local(p,shrew.yaw,-0.16,0.76,0.35),V(.065,.075,.02),PAL.shrewEar,shrew.yaw,'low');
  emitSphere(out,local(p,shrew.yaw,0.16,0.76,0.35),V(.065,.075,.02),PAL.shrewEar,shrew.yaw,'low');

  const sniffAmp=.05 + .025*idleSniff;
  const nose1=local(p,shrew.yaw,0,0.57,0.68+.01*Math.sin(t*6+shrew.seed));
  const nose2=local(p,shrew.yaw,0,0.56,0.96+Math.sin(t*14)*sniffAmp);
  emitChain(out,head,nose1,.06,shade(PAL.shrewA,1.08),'low');
  emitChain(out,nose1,nose2,.045,shade(PAL.shrewA,1.12),'low');
  emitCone(out,local(p,shrew.yaw,0,0.55,1.08+Math.sin(t*14)*0.06),V(.038,.18,.038),shade(PAL.shrewA,1.15),shrew.yaw,Math.PI/2);
  emitSphere(out,local(p,shrew.yaw,0,0.55,1.22+Math.sin(t*14)*0.06),V(.035,.03,.035),PAL.dark,shrew.yaw,'low');

  emitSphere(out,local(p,shrew.yaw,-0.08,0.63,0.46),V(.03,.03,.03),PAL.dark,0,'low');
  emitSphere(out,local(p,shrew.yaw,0.08,0.63,0.46),V(.03,.03,.03),PAL.dark,0,'low');

  const legA=Math.sin(rt*2)*0.12, legB=Math.sin(rt*2+Math.PI)*0.12;
  const legPairs=[
    [local(p,shrew.yaw,-0.20,0.28,0.20), local(p,shrew.yaw,-0.24,0.02,0.12+legA)],
    [local(p,shrew.yaw,0.20,0.28,0.20),  local(p,shrew.yaw,0.24,0.02,0.12+legB)],
    [local(p,shrew.yaw,-0.18,0.28,-0.18),local(p,shrew.yaw,-0.22,0.02,-0.08+legB)],
    [local(p,shrew.yaw,0.18,0.28,-0.18), local(p,shrew.yaw,0.22,0.02,-0.08+legA)]
  ];
  for(const lp of legPairs) emitChain(out,lp[0],lp[1],.055,PAL.shrewB,'low');

  const tail0=local(p,shrew.yaw,0,0.50,-0.42), tail1=local(p,shrew.yaw,0,0.48,-0.72), tail2=local(p,shrew.yaw,0,0.46,-1.0);
  emitChain(out,tail0,tail1,.04,shade(PAL.shrewA,.96),'low');
  emitChain(out,tail1,tail2,.026,shade(PAL.shrewA,.96),'low');
}

function emitMiniMouse(out,m,t){
  const p=m.p, yaw=m.yaw;
  const sniff=(m.state==='idle'?Math.sin(t*5+m.seed)*.015:0);
  const hop=m.hop + (m.state==='idle'?Math.sin(t*2.2+m.seed)*.008:0);
  emitShadow(out,V(p.x,terrainHeight(p.x,p.z)+0.005,p.z),.20,.11,.40);
  emitSphere(out,local(p,yaw,0,.19+hop,0),V(.19,.14,.13),shade(PAL.mouseBody,1.05),yaw,'low');
  emitSphere(out,local(p,yaw,0,.27+hop,.18),V(.11,.09,.10),PAL.mouseBody2,yaw,'low');
  emitCone(out,local(p,yaw,0,.27+hop,.31+sniff),V(.045,.12,.045),PAL.pink,yaw,Math.PI/2);
  emitSphere(out,local(p,yaw,-.06,.36+hop,.16+sniff*.3),V(.05,.06,.02),PAL.mouseBody2,yaw,'low');
  emitSphere(out,local(p,yaw,.06,.36+hop,.16+sniff*.3),V(.05,.06,.02),PAL.mouseBody2,yaw,'low');
  const tail0=local(p,yaw,0,.20+hop,-.14), tail1=local(p,yaw,0,.18+hop,-.32);
  emitChain(out,tail0,tail1,.018,PAL.pink,'low');
}


function updateMrMousy(dt){
  mrMousy.t+=dt;
  mrMousy.timer-=dt;
  mrMousy.idleNod=Math.sin(mrMousy.t*1.7+mrMousy.seed)*.012;
  const d=Math.hypot(player.p.x-mrMousy.p.x,player.p.z-mrMousy.p.z);

  if(d<2.4){
    const desired=Math.atan2(player.p.x-mrMousy.p.x,player.p.z-mrMousy.p.z);
    mrMousy.yaw=lerpAngle(mrMousy.yaw,desired,1-Math.exp(-dt*5));
    mrMousy.walkPhase+=dt*.6;
    if(mrMousy.timer<=0){
      mouseTalk('mousy');
      showMsg('Mr Mousy: squi-squi!',.65);
      mrMousy.timer=3.4+Math.random()*3.2;
    }
  }else{
    const a=mrMousy.t*.22;
    const tx=-4.8+Math.sin(a)*1.2,tz=-1.5+Math.cos(a*.8)*.85;
    const dx=tx-mrMousy.p.x,dz=tz-mrMousy.p.z;
    const dist=Math.hypot(dx,dz);
    if(dist>.18){
      mrMousy.yaw=lerpAngle(mrMousy.yaw,Math.atan2(dx,dz),1-Math.exp(-dt*4));
      mrMousy.p.x+=dx*dt*.65;
      mrMousy.p.z+=dz*dt*.65;
      mrMousy.walkPhase+=dt*2.1;
    }else{
      mrMousy.yaw+=Math.sin(mrMousy.t*1.2+mrMousy.seed)*dt*.18;
      mrMousy.walkPhase+=dt*.35;
    }
  }
  mrMousy.p.y=terrainHeight(mrMousy.p.x,mrMousy.p.z);
}

function updateShrew(dt){
  shrew.t+=dt;
  shrew.timer-=dt;

  const settleY=terrainHeight(shrew.p.x,shrew.p.z);
  shrew.p.y=lerp(shrew.p.y,settleY,1-Math.exp(-dt*12));

  if(shrew.mode==='idle'){
    shrew.runT+=dt*.25;
    shrew.idlePose=Math.sin(shrew.t*1.4+shrew.seed)*.012;
    shrew.yaw += Math.sin(shrew.t*1.1+shrew.seed)*dt*.12;
    if(shrew.timer<=0){
      const candidates=[player,mrMousy,...minis];
      const target=candidates[(Math.random()*candidates.length)|0];
      shrew.sniffTarget=target;
      const tyaw=(target.yaw||0)+Math.PI;
      shrew.target=V(
        target.p.x+Math.sin(tyaw)*.48,
        terrainHeight(target.p.x,target.p.z),
        target.p.z+Math.cos(tyaw)*.48
      );
      shrew.mode='dash';
      shrew.timer=.75+Math.random()*.40;
      if(Math.random()<.35) mouseTalk('paquito');
    }
  }else if(shrew.mode==='dash'){
    shrew.runT+=dt*9.5;
    const dx=shrew.target.x-shrew.p.x,dz=shrew.target.z-shrew.p.z;
    const d=Math.hypot(dx,dz);
    if(d>.03){
      const desiredYaw=Math.atan2(dx,dz);
      shrew.yaw=lerpAngle(shrew.yaw,desiredYaw,1-Math.exp(-dt*18));
      const sp=10.0;
      shrew.p.x+=Math.sin(shrew.yaw)*sp*dt;
      shrew.p.z+=Math.cos(shrew.yaw)*sp*dt;
      shrew.p.x=clamp(shrew.p.x,-17.5,17.5);
      shrew.p.z=clamp(shrew.p.z,-17.5,17.5);
    }
    if(d<.55 || shrew.timer<=0){
      shrew.mode='sniff';
      shrew.timer=.65+Math.random()*.45;
      mouseTalk('sniff');
      if(Math.random()<.7) showMsg('Paquito annusa culi...',.45);
    }
  }else if(shrew.mode==='sniff'){
    shrew.runT+=dt*.5;
    if(shrew.sniffTarget){
      const t=shrew.sniffTarget;
      const desiredYaw=Math.atan2(t.p.x-shrew.p.x,t.p.z-shrew.p.z);
      shrew.yaw=lerpAngle(shrew.yaw,desiredYaw,1-Math.exp(-dt*12));

      // Paquito keeps aiming for the rear of the target: butt-sniff mode.
      const tyaw=(t.yaw||0)+Math.PI;
      shrew.target.x=t.p.x+Math.sin(tyaw)*.44;
      shrew.target.z=t.p.z+Math.cos(tyaw)*.44;
      const dx=shrew.target.x-shrew.p.x, dz=shrew.target.z-shrew.p.z;
      const dd=Math.hypot(dx,dz);
      if(dd>.08){
        shrew.p.x+=dx*Math.min(1,dt*5.0);
        shrew.p.z+=dz*Math.min(1,dt*5.0);
      }
    }
    if(Math.random()<dt*2.2){
      mouseTalk('sniff');
      if(Math.random()<.22) showMsg('Paquito annusa culi...',.38);
    }
    if(shrew.timer<=0){
      shrew.mode='escape';
      shrew.timer=.28+Math.random()*.28;
      shrew.yaw+=Math.PI*(.6+Math.random()*.8);
      haptic([12,18,12]);
    }
  }else{
    shrew.runT+=dt*12.0;
    const sp=11.5;
    shrew.p.x+=Math.sin(shrew.yaw)*sp*dt;
    shrew.p.z+=Math.cos(shrew.yaw)*sp*dt;
    shrew.p.x=clamp(shrew.p.x,-17.5,17.5);
    shrew.p.z=clamp(shrew.p.z,-17.5,17.5);
    if(shrew.timer<=0){
      shrew.mode='idle';
      shrew.timer=1.2+Math.random()*2.2;
    }
  }
}

function updateMinis(dt){
  const now=performance.now()*0.001;
  for(const m of minis){
    m.timer -= dt;
    if(m.state==='idle'){
      m.speed = lerp(m.speed,0,1-Math.exp(-dt*10));
      m.hop = Math.sin(now*2.4 + m.seed)*0.006 + Math.sin(now*6.4 + m.seed*.7)*0.004;
      m.wiggle = Math.sin(now*2.1 + m.seed)*.16;
      m.yaw = lerpAngle(m.yaw, m.idleTurn + m.wiggle, 1-Math.exp(-dt*2.2));
      if(m.timer<=0){
        if(Math.random()<.34){
          m.idleTurn = Math.random()*Math.PI*2;
          m.timer=.28+Math.random()*1.5;
        }else{
          m.state='dash';
          m.timer=.20+Math.random()*.50;
          m.dashDir=Math.random()*Math.PI*2;
          m.speed=7.8+Math.random()*7.2;
        }
      }
    }else{
      m.yaw=lerpAngle(m.yaw,m.dashDir,1-Math.exp(-dt*16));
      m.p.x += Math.sin(m.yaw)*m.speed*dt;
      m.p.z += Math.cos(m.yaw)*m.speed*dt;
      m.p.x=clamp(m.p.x,-18,18); m.p.z=clamp(m.p.z,-18,18);
      m.p.y = terrainHeight(m.p.x,m.p.z);
      m.hop = Math.abs(Math.sin(now*24 + m.p.x*0.6))*0.10;
      if(m.timer<=0){
        m.state='idle';
        m.timer=.25+Math.random()*2.7;
        m.speed=0;
        m.idleTurn=Math.random()*Math.PI*2;
      }
    }
  }
}

let moveX=0, moveY=0, joyId=null;
function joyUpdate(e){
  const r=joy.getBoundingClientRect();
  const x=e.clientX-(r.left+r.width/2), y=e.clientY-(r.top+r.height/2);
  const max=r.width*.34;
  const raw=Math.min(1,Math.hypot(x,y)/max);
  const dead=.16;
  let mag=raw<=dead?0:(raw-dead)/(1-dead);
  mag=mag*mag*(3-2*mag);
  const a=Math.atan2(y,x);
  const sx=Math.cos(a)*max*raw, sy=Math.sin(a)*max*raw;
  stick.style.transform=`translate(${sx}px,${sy}px)`;
  moveX=Math.cos(a)*mag; moveY=Math.sin(a)*mag;
}

  joyId=e.pointerId; joy.setPointerCapture(e.pointerId); joyUpdate(e);

  if(e.pointerId!==joyId)return;
  e.preventDefault(); e.stopPropagation(); joyUpdate(e);
});

  if(e.pointerId!==joyId)return;

function haptic(pattern){
  if(navigator.vibrate)navigator.vibrate(pattern);

function ensureAudio(){
  if(!audio){
    audio=new (window.AudioContext||window.webkitAudioContext)();

    sfxBus=audio.createGain();
    sfxBus.gain.value=.78;
    sfxBus.connect(audio.destination);

    musicBus=audio.createGain();
    musicBus.gain.value=.24;
    musicFilter=audio.createBiquadFilter();
    musicFilter.type='lowpass';
    musicFilter.frequency.value=1450;
    musicFilter.Q.value=.3;
    musicBus.connect(musicFilter);
    musicFilter.connect(audio.destination);
  }
  if(audio.state==='suspended')audio.resume();
}

function tone(freq=440,dur=.12,type='square',vol=.05,slide=0){
  ensureAudio();
  const o=audio.createOscillator(),g=audio.createGain();
  o.type=type;
  o.frequency.setValueAtTime(freq,audio.currentTime);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,freq+slide),audio.currentTime+dur);
  g.gain.setValueAtTime(Math.max(.0001,vol),audio.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);
  o.connect(g);g.connect(sfxBus);o.start();o.stop(audio.currentTime+dur);
}

const chordBank=[
  [130.81,164.81,196.00],
  [110.00,130.81,164.81],
  [87.31,130.81,164.81],
  [98.00,146.83,164.81],
  [123.47,155.56,196.00],
  [110.00,146.83,174.61]
];
const chordOrder=[0,1,2,3,0,4,1,5,2,0,3,4,1,2,5,3,0,1,4,2,3,5,1,0];

function schedulePad(freq,start,dur,level=.012,type='sine'){
  const o=audio.createOscillator(),g=audio.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(.0001,start);
  g.gain.linearRampToValueAtTime(level,start+.9);
  g.gain.setValueAtTime(level,start+dur-1.2);
  g.gain.exponentialRampToValueAtTime(.0001,start+dur);
  o.connect(g);g.connect(musicBus);
  o.start(start);o.stop(start+dur+.05);
}
function scheduleBell(freq,start){
  const o=audio.createOscillator(),g=audio.createGain(),lp=audio.createBiquadFilter();
  o.type='sine';o.frequency.value=freq*2;
  lp.type='lowpass';lp.frequency.value=1800;
  g.gain.setValueAtTime(.0001,start);
  g.gain.linearRampToValueAtTime(.016,start+.015);
  g.gain.exponentialRampToValueAtTime(.0001,start+1.8);
  o.connect(lp);lp.connect(g);g.connect(musicBus);
  o.start(start);o.stop(start+1.9);
}
function scheduleMusic(){
  if(!audio||!musicBus)return;
  const ahead=12;
  while(musicNext<audio.currentTime+ahead){
    const chord=chordBank[chordOrder[musicStep%chordOrder.length]];
    const start=musicNext;
    const dur=6;
    schedulePad(chord[0]/2,start,dur,0.013,'sine');
    schedulePad(chord[0],start+.08,dur-.12,0.010,'triangle');
    schedulePad(chord[1],start+.18,dur-.25,0.008,'sine');
    schedulePad(chord[2],start+.30,dur-.40,0.007,'sine');

    const variant=(musicStep*7+3)%9;
    scheduleBell(chord[(musicStep+1)%3]*(variant%3===0?2:1),start+1.45+(variant%4)*.32);
    if(musicStep%3===1)scheduleBell(chord[2]*1.5,start+4.15);

    musicStep++;
    musicNext+=dur;
  }
}

const titleProgression=[
  [261.63,329.63,392.00],

];

function titleNote(freq,start,dur=.16,vol=.026,type='square'){
  const o=audio.createOscillator(),g=audio.createGain(),lp=audio.createBiquadFilter();
  o.type=type;o.frequency.setValueAtTime(freq,start);
  lp.type='lowpass';lp.frequency.value=2600;lp.Q.value=.4;
  g.gain.setValueAtTime(.0001,start);
  g.gain.linearRampToValueAtTime(vol,start+.012);
  g.gain.exponentialRampToValueAtTime(.001,start+dur);
  o.connect(lp);lp.connect(g);g.connect(musicBus);o.start(start);o.stop(start+dur+.03);
}
function titleKick(start){
  const o=audio.createOscillator(),g=audio.createGain();
  o.type='sine';o.frequency.setValueAtTime(120,start);
  o.frequency.exponentialRampToValueAtTime(48,start+.11);
  g.gain.setValueAtTime(.045,start);
  g.gain.exponentialRampToValueAtTime(.001,start+.13);
  o.connect(g);g.connect(musicBus);o.start(start);o.stop(start+.14);
}
function titleHat(start){
  const dur=.035,buf=audio.createBuffer(1,Math.floor(audio.sampleRate*dur),audio.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  const n=audio.createBufferSource(),g=audio.createGain(),hp=audio.createBiquadFilter();
  n.buffer=buf;hp.type='highpass';hp.frequency.value=4200;g.gain.value=.009;
  n.connect(hp);hp.connect(g);g.connect(musicBus);n.start(start);n.stop(start+dur);
}
function scheduleTitleMusic(){
  if(!audio||!titleMusicStarted)return;
  while(titleMusicNext<audio.currentTime+5){
    const bar=titleMusicStep>>3;
    const step=titleMusicStep&7;
    const beat=.235;
    const chord=titleProgression[bar%titleProgression.length];
    const t=titleMusicNext;

    // bright arpeggio / melody
    const note=titleMelody[titleMusicStep%titleMelody.length];
    titleNote(note,t,.17,.021,step%2?'triangle':'square');
    if(step%2===0) titleNote(chord[(step/2)%3],t+.035,.25,.010,'triangle');

    // bass
    if(step%2===0) titleNote(chord[0]/2,t,.21,.020,'square');

    // simple 1998 drum-machine pulse
    if(step===0||step===4) titleKick(t);
    titleHat(t+.11);

    titleMusicStep++;
    titleMusicNext+=beat;
  }
}
function startTitleMusic(){
  ensureAudio();
  if(titleMusicStarted)return;
  titleMusicStarted=true;
  titleMusicStep=0;
  titleMusicNext=audio.currentTime+.03;
  scheduleTitleMusic();
  titleMusicTimer=setInterval(scheduleTitleMusic,850);
}
function stopTitleMusic(){
  titleMusicStarted=false;

}

function startMusic(){

  musicStep=0;

}

  }

let ambientVoiceTimer=3.0;
function updateMouseVoices(dt){
  if(!running)return;
  ambientVoiceTimer-=dt;
  if(ambientVoiceTimer>0)return;
  ambientVoiceTimer=3.5+Math.random()*6.5;
  if(Math.random()<.55) mouseTalk('mouse');
  if(Math.random()<.20) showMsg('squi!',.35);
}

let msgTimer=0;
function showMsg(txt,d=1.2){
  message.textContent=txt;
  message.style.opacity='1';
  clearTimeout(msgTimer);
  msgTimer=setTimeout(()=>message.style.opacity='0', d*1000);
}
function showPickup(txt){
  pickupFx.textContent=txt;
  pickupFx.style.display='block';
  pickupFx.style.opacity='1';
  pickupFx.classList.remove('pop');
  void pickupFx.offsetWidth;
  pickupFx.classList.add('pop');
  setTimeout(()=>{ if(!pickupFx.classList.contains('pop')) pickupFx.style.opacity='0'; },1250);
}
function updateHUD(){
  if(player.brownies===0 && !player.key){
    stats.style.display='none';
    mission.textContent='ESPLORA L’ISOLA';
    return;
  }
  stats.style.display='block';
  brownieStat.textContent=`BROWNIES  ${player.brownies}/5`;
  keyStat.textContent=player.key?'CHIAVE  ✓':'CHIAVE  —';
  if(player.brownies<5) mission.textContent='TROVA I BROWNIES';
  else if(!player.key) mission.textContent='CERCA LA CHIAVE';
  else mission.textContent='RAGGIUNGI IL PACCO';
}


function pushOutCircle(x,z,cx,cz,minDist){
  let dx=x-cx,dz=z-cz;
  let d=Math.hypot(dx,dz);
  if(d>=minDist)return {x,z,hit:false};
  if(d<0.0001){dx=1;dz=0;d=1;}
  const k=minDist/d;
  return {x:cx+dx*k,z:cz+dz*k,hit:true};
}
function resolveWorldCollision(x,z){
  let px=clamp(x,-18.2,18.2), pz=clamp(z,-18.2,18.2);
  const playerR=.28;

  // Two relaxation passes make corner contacts stable instead of jittery.
  for(let pass=0;pass<2;pass++){
    for(const r of rocks){
      const rr=Math.max(.45,r.s*.68)+playerR;
      const q=pushOutCircle(px,pz,r.x,r.z,rr);
      px=q.x;pz=q.z;
    }
    for(const t of trees){
      const q=pushOutCircle(px,pz,t.x,t.z,.32*t.s+playerR);
      px=q.x;pz=q.z;
    }
    if(!gift.opened){
      const q=pushOutCircle(px,pz,gift.p.x,gift.p.z,.70+playerR);
      px=q.x;pz=q.z;
    }
  }
  return {x:px,z:pz};
}

function updatePlayer(dt){
  let ix=moveX, iy=moveY;
  if(keys['a']||keys['arrowleft']) ix-=1;
  if(keys['d']||keys['arrowright']) ix+=1;
  if(keys['w']||keys['arrowup']) iy-=1;
  if(keys['s']||keys['arrowdown']) iy+=1;
  const il=Math.hypot(ix,iy); if(il>1){ix/=il; iy/=il;}

  const fw=V(-Math.sin(cam.yaw),0,-Math.cos(cam.yaw));
  const rt=V(Math.cos(cam.yaw),0,-Math.sin(cam.yaw));
  let wish=add(mul(rt,ix), mul(fw,-iy));
  const wl=Math.hypot(wish.x,wish.z);
  if(wl>.01) wish=mul(norm(wish),1);

  const analog=clamp(Math.hypot(ix,iy),0,1);
  const maxSp=inWater(player.p.x,player.p.z)?4.2:6.45;
  const targetSp=maxSp*(.10+.90*analog);
  const response=wl>.01?(player.grounded?12.0:6.0):16.0;
  const target=wl>.01?mul(wish,targetSp):V();
  player.v.x=lerp(player.v.x,target.x,1-Math.exp(-dt*response));
  player.v.z=lerp(player.v.z,target.z,1-Math.exp(-dt*response));

  const currentSp=Math.hypot(player.v.x,player.v.z);
  player.runT += currentSp*dt*.88;
  const stepMark=Math.floor(player.runT*3.0);
  if(player.grounded && currentSp>1.15 && stepMark!==player.lastStep){
    player.lastStep=stepMark;
    footstep();
  }
  if(wl>.04){
    const desiredYaw=Math.atan2(wish.x,wish.z);
    player.yaw=lerpAngle(player.yaw,desiredYaw,1-Math.exp(-dt*11.5));
  }

  player.fartTimer-=dt;
  if(player.grounded && currentSp>1.4 && player.fartTimer<=0){
    fart(.38);
    haptic(6);
    player.fartTimer=4.0+Math.random()*6.5;
  }

  if(jumpQueued && player.grounded){
    player.v.y=6.35;
    player.grounded=false;
    tone(165,.07,'triangle',.025,80);
    haptic(8);
  }
  jumpQueued=false;

  player.v.y-=15.5*dt;
  const oldX=player.p.x, oldZ=player.p.z;

  // X then Z gives predictable wall/rock sliding instead of tunnelling.
  let q=resolveWorldCollision(oldX+player.v.x*dt,oldZ);
  const hitX=Math.abs(q.x-(oldX+player.v.x*dt))>.015;
  player.p.x=q.x; player.p.z=q.z;

  q=resolveWorldCollision(player.p.x,oldZ+player.v.z*dt);
  const hitZ=Math.abs(q.z-(oldZ+player.v.z*dt))>.015;
  player.p.x=q.x; player.p.z=q.z;

  if(hitX) player.v.x*=.18;
  if(hitZ) player.v.z*=.18;

  player.p.y+=player.v.y*dt;

  const floor=terrainHeight(player.p.x,player.p.z);
  if(player.p.y<=floor && player.v.y<=0){
    player.p.y=floor; player.v.y=0; player.grounded=true;
  }else{
    player.grounded=false;
  }

  checkPickups();
}

function checkPickups(){
  const t=performance.now()/1000;
  for(const b of brownies){
    if(b.got) continue;
    if(Math.hypot(player.p.x-b.p.x, player.p.z-b.p.z)<1.0){
      b.got=true;
      player.brownies++;
      fart(1.02); haptic([12,20,10]);
      tone(210,.06,'square',.02,40);
      showPickup('+1 Brownie 💨');
      showMsg('Brownie! 💨',.95);
      if(player.brownies===5){
        keyItem.visible=true;
        tone(650,.18,'triangle',.07,420);
        showPickup('CHIAVE SBLOCCATA!');
        showMsg('Chiave!',.95);
      }
      updateHUD();
    }
  }
  if(keyItem.visible && !keyItem.got && Math.hypot(player.p.x-keyItem.p.x,player.p.z-keyItem.p.z)<1.0){
    keyItem.got=true; player.key=true;
    tone(760,.20,'square',.08,540); haptic([18,35,18]);
    showPickup('CHIAVE TROVATA!');
    showMsg('CHIAVE TROVATA!',1.2);
    updateHUD();
  }
}

let won=false;
let celebrationTimer=0;
let fxSprites=[];
function celebrationBurst(strength=1){
  const cx=SW*(.28+Math.random()*.44);
  const cy=SH*(.28+Math.random()*.22);
  const n=Math.floor(24+26*strength);
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2;
    const sp=(1.8+Math.random()*5.6)*strength;
    if(Math.random()<.42){
      fxSprites.push({
        kind:'face',x:cx,y:cy,
        vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3.6*strength,
        life:1,sz:16+Math.random()*20,r:Math.random()*6.28,vr:(Math.random()-.5)*.26
      });
    }else{
      fxSprites.push({
        kind:'dust',x:cx,y:cy,
        vx:Math.cos(a)*sp*.8,vy:Math.sin(a)*sp*.8-2.2,
        life:1,sz:2+Math.random()*4,
        color:['#ffd44d','#ffb347','#ef7ca0','#fff6cf'][Math.floor(Math.random()*4)]
      });
    }
  }
  if(Math.random()<.45) fart(.34);
  tone(320+Math.random()*260,.10,'triangle',.022,120);
}

function tryAction(){
  const dGift=Math.hypot(player.p.x-gift.p.x,player.p.z-gift.p.z);
  if(dGift<2.0){
    tryOpenGift();
    return;
  }

  const dShrew=Math.hypot(player.p.x-shrew.p.x,player.p.z-shrew.p.z);
  if(dShrew<2.1){
    mouseTalk('paquito');
    showMsg('Paquito: snuf snuf...',.75);
    haptic([10,18,10]);
    return;
  }

  const dMousy=Math.hypot(player.p.x-mrMousy.p.x,player.p.z-mrMousy.p.z);
  if(dMousy<2.1){
    mouseTalk('mousy');
    showMsg('Mr Mousy: squi-squi!',.75);
    haptic(10);
    return;
  }

  let nearestMini=null, best=99;
  for(const m of minis){
    const d=Math.hypot(player.p.x-m.p.x,player.p.z-m.p.z);
    if(d<best){ best=d; nearestMini=m; }
  }
  if(nearestMini && best<1.35){
    mouseTalk('mouse');
    showMsg('squi!',.45);
    haptic(8);
    return;
  }

  fart(.92);
  showMsg('Prrt!',.32);
  haptic(8);
}

function tryOpenGift(){
  if(won) return;
  const d=Math.hypot(player.p.x-gift.p.x,player.p.z-gift.p.z);
  if(d>2.0){ showMsg('Avvicinati al pacco.',.8); return; }
  if(player.brownies<5){ showMsg(`Mancano ${5-player.brownies} brownie.`,1.0); return; }
  if(!player.key){ showMsg('Serve la chiave!',1.0); return; }

  won=true;
  gift.opened=true;
  celebrationTimer=.35;
  tone(210,.5,'sawtooth',.06,660); fart(.72); haptic([20,35,35,45]);
  tone(420,.3,'triangle',.05,220);

  // Initial big blast from the box.
  for(let k=0;k<3;k++) celebrationBurst(1.0+k*.08);

  setTimeout(()=>ending.style.display='flex',420);
}

function updateFX(){
  const arr=[];
  for(const p of fxSprites){
    if(p.kind==='fart'){
      p.x+=p.vx; p.y+=p.vy;
      p.vx*=.985;
      p.vy*=.986;
      p.sz+=0.30;
      p.r += p.vr || 0;
      p.life -= 0.022;
      if(p.life>0 && p.y>-80 && p.y<SH+80) arr.push(p);
      continue;
    }
    p.x+=p.vx; p.y+=p.vy;
    p.vy += p.kind==='face' ? 0.18 : 0.04;
    p.r += p.vr || 0;
    p.life -= p.kind==='face' ? 0.012 : 0.022;
    if(p.life>0 && p.y<SH+60) arr.push(p);
  }
  fxSprites=arr;
}


function emitWaterPatch(out,x0,z0,s,t){
  const a=V(x0,waterHeight(x0,z0,t),z0);
  const b=V(x0+s,waterHeight(x0+s,z0,t),z0);
  const c=V(x0+s,waterHeight(x0+s,z0+s,t),z0+s);
  const d=V(x0,waterHeight(x0,z0+s,t),z0+s);
  const shimmer=.94+.08*Math.sin(t*1.2 + x0*.18 - z0*.23);
  const col=shade((((x0/s)|0)+((z0/s)|0))&1 ? PAL.waterA : PAL.waterB,shimmer);
  out.push({a,b,c,color:col,water:true});
  out.push({a:a,b:c,c:d,color:shade(col,.96),water:true});
}
function emitAnimatedSea(out,t){
  const seaStep=3.8;
  for(let z=-52;z<52;z+=seaStep){
    for(let x=-52;x<52;x+=seaStep){
      const cx=x+seaStep*.5, cz=z+seaStep*.5;
      if(Math.hypot(cx,cz)>56) continue;
      if(islandField(cx,cz)<-2.2) continue;

      // dark submerged underlay prevents gaps under animated water near the coast
      const ua=V(x,SEA_LEVEL-0.16,z);
      const ub=V(x+seaStep,SEA_LEVEL-0.16,z);
      const uc=V(x+seaStep,SEA_LEVEL-0.16,z+seaStep);
      const ud=V(x,SEA_LEVEL-0.16,z+seaStep);
      const underCol=shade(PAL.waterB,.62);
      out.push({a:ua,b:ub,c:uc,color:underCol,water:true});
      out.push({a:ua,b:uc,c:ud,color:shade(underCol,.94),water:true});

      emitWaterPatch(out,x,z,seaStep,t);
    }
  }
  // animate the inner pond too, but finer and local
  const pondStep=1.7;
  for(let z=-9.5;z<-1.0;z+=pondStep){
    for(let x=2.0;x<10.5;x+=pondStep){
      const cx=x+pondStep*.5, cz=z+pondStep*.5;
      if(pondField(cx,cz)>=0 || islandField(cx,cz)>-0.2) continue;
      emitWaterPatch(out,x,z,pondStep,t*0.9);
    }
  }
}

function emitDynamicScene(){
  const out=[];
  const t=performance.now()/1000;
  emitAnimatedSea(out,t);
  for(const b of brownies) if(!b.got) emitBrownie(out,b.p,t+b.bob);
  if(keyItem.visible && !keyItem.got) emitKey(out,keyItem.p,t);
  emitGift(out);
  emitMousePlayer(out,t);
  emitMrMousy(out,t);
  emitShrew(out,t);
  for(const m of minis) emitMiniMouse(out,m,t);
  return out;
}

let running=false, last=performance.now();


function bootChime(){
  // Browsers require user interaction for audio, so the visual boot always runs;
  // this chime is played on the first tap if audio is still locked.
  if(!audio) return;
  const t=audio.currentTime+.02;
  const tones=[
    [164.81,0,.55,'sine',.028],
    [246.94,.15,.75,'sine',.024],
    [329.63,.31,.92,'triangle',.022],
    [493.88,.48,1.05,'sine',.018]
  ];
  for(const q of tones){
    const o=audio.createOscillator(),g=audio.createGain();
    o.type=q[3]; o.frequency.setValueAtTime(q[0],t+q[1]);
    g.gain.setValueAtTime(.0001,t+q[1]);
    g.gain.linearRampToValueAtTime(q[4],t+q[1]+.035);
    g.gain.exponentialRampToValueAtTime(.001,t+q[1]+q[2]);
    o.connect(g);g.connect(sfxBus);o.start(t+q[1]);o.stop(t+q[1]+q[2]+.03);
  }
}
function runBoot(){
  setTimeout(()=>{
    start.style.display='flex';
    try{ startTitleMusic(); }catch(e){}
    boot.classList.add('bootOut');
  },4300);
  setTimeout(()=>{ boot.style.display='none'; },5050);
}


start.addEventListener('pointerdown',()=>{
  if(start.style.display!=='none') startTitleMusic();
},{passive:true});

function startGame(){
  ensureAudio();
  stopTitleMusic();
  bootChime();
  startMusic();
  start.style.display='none';
  running=true;
  last=performance.now();
  showMsg('AVVENTURA INIZIATA',.8);
}

startBtn.addEventListener('click',startGame);

function loop(now){
  const dt=Math.min(.033,(now-last)/1000||.016); last=now;
  if(running){
    updatePlayer(dt);
    updateMrMousy(dt);
    updateShrew(dt);
    updateMinis(dt);
    updateMouseVoices(dt);

    if(won){
      celebrationTimer-=dt;
      if(celebrationTimer<=0){
        celebrationBurst(.48+Math.random()*.45);
        celebrationTimer=.55+Math.random()*1.15;
        if(Math.random()<.32) haptic(5);
      }
    }
  }
  if(gift.opened) gift.open=clamp(gift.open+dt*1.8,0,1);
  updateCamera(dt);
  drawMorningSky(now);
  drawWorldFog(now);

  updateFX();
  renderScene(emitDynamicScene(), fxSprites);
  requestAnimationFrame(loop);
}
runBoot();
updateHUD();
requestAnimationFrame(loop);

})();
</script>
